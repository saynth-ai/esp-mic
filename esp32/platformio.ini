; ESP32 Wi-Fi microphone — PlatformIO configuration
;
; Needs Arduino-ESP32 3.x (ESP-IDF 5 I2S "std" driver). The stock
; "espressif32" platform in PlatformIO still ships Arduino 2.x, so we use the
; community-maintained pioarduino platform, which tracks Arduino-ESP32 3.x.
;
;   pio run                    build
;   pio run -t upload          flash
;   pio device monitor         serial log (115200)

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
  links2004/WebSockets@^2.7.1
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; Uncomment to override config.h without editing it:
  ; -D DEVICE_ID=\"esp32-mic-002\"
  ; -D I2S_DIN=32

[env:esp32dev]
board = esp32dev
upload_speed = 921600

; Silent production build: no Serial output at all.
[env:esp32dev-release]
board = esp32dev
upload_speed = 921600
build_flags =
  -DDEBUG_SERIAL=0
  -DCORE_DEBUG_LEVEL=0
