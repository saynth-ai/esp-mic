# live.patoari.com — ESP32 Wi-Fi mic recorder (esp32-mic, Docker).
#
#   Browser / ESP32 ──HTTPS/WSS :443──▶ nginx ──▶ 10.11.21.2:8095 (container)
#
# Cloudflare proxy is OFF (DNS-only) so Let's Encrypt terminates here:
#   cert: /etc/letsencrypt/live/live.patoari.com  (certbot timer renews;
#         renewal-hooks/deploy/reload-nginx.sh reloads nginx)
# One port for everything: dashboard, REST, and the WebSockets
#   /audio (devices, DEVICE_TOKEN)  /ws + /ws/live (dashboard, admin login).
# Note: 127.0.0.1:8095 is surjoone's frontend — this app is on 10.11.21.2:8095.
#
# If the Cloudflare proxy is turned back on: include snippets/cloudflare-allow.conf
# in the 443 server and stop clearing CF-Connecting-IP (the app then reads it).

map $http_upgrade $mic_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME challenge + redirect ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name live.patoari.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://live.patoari.com$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name live.patoari.com;

    ssl_certificate     /etc/letsencrypt/live/live.patoari.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.patoari.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # No uploads; requests are small.
    client_max_body_size 1m;

    location / {
        proxy_pass http://10.11.21.2:8095;
        proxy_http_version 1.1;

        # WebSocket upgrade on the same port (/audio, /ws, /ws/live)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mic_connection_upgrade;

        proxy_set_header Host $host;
        # Direct connections: the client is $remote_addr. Clear any client-sent
        # CF-Connecting-IP so it can't be spoofed (the app prefers that header).
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Continuous audio streams / live listening: no buffering, long timeouts
        # (the app pings every 10 s).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
